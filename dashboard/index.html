<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gith Port Manager</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark">
  <div id="app">
    <header>
      <h1>Port Manager Dash</h1>
      <div class="auth-box">
        <input type="password" id="pat-token" placeholder="Enter GitHub PAT">
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>

    <main>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search project name...">
      </div>
      <div id="port-list" class="port-grid">
        <!-- Dashboard items will be rendered here -->
        <p class="loading">Loading projects from Gist...</p>
      </div>
    </main>

    <footer>
      <p>Data stored in Gist: <a href="https://gist.github.com/tackelua/cf2bff0d9e33c2f9112c1e62fe18b5ee" target="_blank">cf2bff0d</a></p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
